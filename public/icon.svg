<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64C8FF"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="pillTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F4FF"/>
    </linearGradient>
    <linearGradient id="pillBot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8FA3"/>
      <stop offset="100%" stop-color="#E64980"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g transform="translate(256 256) rotate(-45)" filter="url(#shadow)">
    <rect x="-130" y="-70" width="260" height="140" rx="70" fill="url(#pillTop)"/>
    <rect x="0" y="-70" width="130" height="140" rx="0" fill="url(#pillBot)"/>
    <path d="M 130 -70 a 70 70 0 0 1 0 140 z" fill="url(#pillBot)"/>
    <rect x="-2" y="-70" width="4" height="140" fill="rgba(0,0,0,0.12)"/>
    <ellipse cx="-60" cy="-30" rx="38" ry="14" fill="rgba(255,255,255,0.7)"/>
  </g>
</svg>
